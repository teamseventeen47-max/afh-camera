<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AFH Secure Facial Camera</title>

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      padding:18px;
      background:#f3f6f3;
      color:#20352d;
      font-family:Arial,sans-serif
    }
    main{
      max-width:520px;
      margin:auto;
      background:#fff;
      border:1px solid #e1e9e2;
      border-radius:14px;
      padding:18px
    }
    h2{margin:0 0 8px}
    p{font-size:14px;color:#64736b;line-height:1.45}
    video{
      width:100%;
      min-height:260px;
      background:#17251e;
      border-radius:12px;
      object-fit:cover
    }
    button{
      border:0;
      border-radius:8px;
      padding:12px 16px;
      background:#14513f;
      color:#fff;
      font-weight:bold;
      margin:10px 8px 0 0;
      cursor:pointer
    }
    button.alt{background:#e8efea;color:#14513f}
    .notice{
      margin-top:12px;
      padding:11px;
      border-radius:8px;
      background:#eaf3ed;
      color:#14513f;
      font-size:13px;
      white-space:pre-wrap
    }
    .error{background:#fff0ef;color:#b42318}
  </style>
</head>

<body>
  <main>
    <h2>Aunty Fajar Harapan</h2>

    <p>
      Facial verification for the AFH AIS attendance workflow.
      This page generates a face descriptor and does not upload or
      store a face photograph.
    </p>

    <video id="video" autoplay muted playsinline></video>

    <div id="status" class="notice">
      Opening camera automatically…
    </div>

    <!-- These controls remain available as a manual fallback. -->
    <button id="start">Start Camera</button>
    <button id="stop" class="alt">Stop Camera</button>

    <p id="instruction">
      Keep your face centred and well lit. Follow the head-movement
      instruction when requested.
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/human/dist/human.js"></script>

  <script>
    const APPS_SCRIPT_ORIGIN = 'https://script.google.com';

    let stream = null;
    let humanModel = null;
    let busy = false;
    let cameraStarting = false;

    const status = (message, bad = false) => {
      const element = document.getElementById('status');
      element.textContent = message;
      element.className = 'notice' + (bad ? ' error' : '');
    };

    function send(type, extra = {}) {
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage(
          { type, ...extra },
          APPS_SCRIPT_ORIGIN
        );
      }
    }

    async function loadModel() {
      if (humanModel) return humanModel;

      const C =
        (window.Human && typeof window.Human.Human === 'function')
          ? window.Human.Human
          : (typeof window.Human === 'function' ? window.Human : null);

      if (!C) {
        throw new Error(
          'Facial recognition library did not load. Check internet access and refresh.'
        );
      }

      humanModel = new C({
        backend: 'webgl',
        modelBasePath: 'https://cdn.jsdelivr.net/npm/@vladmandic/human/models/',
        face: {
          enabled: true,
          detector: { rotation: true, return: true },
          description: { enabled: true },
          mesh: { enabled: true },
          antispoof: { enabled: true }
        },
        body: { enabled: false },
        hand: { enabled: false },
        object: { enabled: false },
        gesture: { enabled: false }
      });

      await humanModel.load();
      await humanModel.warmup();

      return humanModel;
    }

    async function start() {
      if (stream || cameraStarting) return;

      cameraStarting = true;

      try {
        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia
        ) {
          throw new Error(
            'Camera API is unavailable. Open this page using HTTPS in Chrome.'
          );
        }

        status('Requesting camera access…');

        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'user',
            width: { ideal: 640 },
            height: { ideal: 480 }
          },
          audio: false
        });

        const video = document.getElementById('video');
        video.srcObject = stream;
        await video.play();

        status('Camera is running. Loading facial-recognition model…');

        await loadModel();

        status('Camera ready. Facial capture will begin automatically.');

        send('AFH_CAMERA_READY');

      } catch (error) {
        status(
          'Could not start camera: ' + (error.message || error),
          true
        );

        send('AFH_CAMERA_ERROR', {
          message: error.message || String(error)
        });

      } finally {
        cameraStarting = false;
      }
    }

    async function captureOne() {
      const model = await loadModel();
      const video = document.getElementById('video');

      const result = await model.detect(video);

      if (!result.face || result.face.length !== 1) {
        throw new Error(
          'Please ensure exactly one face is visible in the camera.'
        );
      }

      const face = result.face[0];

      if (!face.embedding || !face.embedding.length) {
        throw new Error(
          'Could not generate a face descriptor. Improve lighting and try again.'
        );
      }

      return {
        descriptor: Array.from(face.embedding),
        yaw: Number(
          face.rotation &&
          face.rotation.angle &&
          face.rotation.angle.yaw || 0
        )
      };
    }

    async function capture(mode) {
      if (busy) return;

      busy = true;

      try {
        if (!stream) {
          throw new Error('The camera is not running.');
        }

        status('Position your face in the centre of the camera.');

        const first = await captureOne();

        status(
          'Face detected. Now slowly turn your head left or right.'
        );

        let second = null;
        let movementDetected = false;

        // Try a few samples so the employee has time to turn their head.
        for (let attempt = 0; attempt < 4; attempt++) {
          await new Promise(resolve => setTimeout(resolve, 650));

          second = await captureOne();

          if (Math.abs(first.yaw - second.yaw) >= 0.04) {
            movementDetected = true;
            break;
          }

          status(
            'Head movement not detected yet. Turn your head a little further.'
          );
        }

        if (!movementDetected || !second) {
          throw new Error(
            'Head movement was not detected. Please try again and turn your head more clearly.'
          );
        }

        let descriptor;

        if (mode === 'register') {
          if (
            first.descriptor.length !== second.descriptor.length
          ) {
            throw new Error(
              'Face model changed during capture. Please try again.'
            );
          }

          // Average the two samples for face registration.
          descriptor = first.descriptor.map(
            (value, index) =>
              (value + second.descriptor[index]) / 2
          );

        } else {
          // Attendance verification uses the second sample,
          // after the movement challenge.
          descriptor = second.descriptor;
        }

        send('AFH_FACE_CAPTURED', {
          descriptor: descriptor,
          challengePassed: true
        });

        status(
          mode === 'register'
            ? 'Face sample sent to AFH AIS for registration.'
            : 'Face sample sent to AFH AIS for verification.'
        );

      } catch (error) {
        status(error.message || String(error), true);

        send('AFH_CAMERA_ERROR', {
          message: error.message || String(error)
        });

      } finally {
        busy = false;
      }
    }

    function stopCamera(closeWindow = false) {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }

      stream = null;
      document.getElementById('video').srcObject = null;

      status('Camera stopped.');

      send('AFH_CAMERA_STOPPED');

      if (closeWindow) {
        window.close();
      }
    }

    document.getElementById('start').addEventListener('click', start);

    document.getElementById('stop').addEventListener('click', function() {
      stopCamera(false);
    });

    window.addEventListener('message', event => {
      // Only accept commands from the AFH Apps Script web app.
      if (event.origin !== APPS_SCRIPT_ORIGIN) return;

      if (event.source !== window.opener) return;

      const data = event.data || {};

      if (data.type === 'AFH_CAMERA_STOP') {
        stopCamera(false);
        return;
      }

      if (data.type === 'AFH_CAMERA_CLOSE') {
        stopCamera(true);
        return;
      }

      if (data.type === 'AFH_CAPTURE_REQUEST') {
        capture(data.mode);
      }
    });

    window.addEventListener('beforeunload', () => {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
    });

    // Automatically request camera access when the popup opens.
    start();
  </script>
</body>
</html>
